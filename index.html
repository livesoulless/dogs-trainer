<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#EBF1F4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1418" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font-size:14px;font-family:system-ui,-apple-system,sans-serif}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<title>Воспитание собаки</title>
<meta name="apple-mobile-web-app-title" content="Собака">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=JetBrains+Mono:wght@500&family=Unbounded:wght@500;700&display=swap">
<style>
/* Layout: phone app — one column, fixed bottom tab bar, command details slide in as a full-screen sheet */
:root{
  --bg:#EBF1F4; --surface:#FFFFFF; --sunk:#DFE8ED; --ink:#15212A; --muted:#566874; --line:#CFDBE1;
  --accent:#EE5A0A; --accent-ink:#B4400A; --accent-soft:#FFE6D6;
  --ok:#1B7F52; --ok-soft:#D8F0E3; --no:#B0331D; --no-soft:#FBE2DC;
  --stage:#D7E8F0; --stage-ground:#93B1C0;
  --dog:#DB9E4C; --dog-dark:#AD7330; --dog-light:#F1CF92; --nose:#2B1D14; --treat:#6E3413; --skin:#EBBB93; --sleeve:#33627D; --pants:#2C4654; --mat:#86B49A; --toy:#2C7DA6; --dog2:#7A8790; --dog2-dark:#4F5B63; --dog2-light:#A9B4BB;
  --f-display:"Unbounded","Golos Text",system-ui,sans-serif;
  --f-body:"Golos Text",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1418; --surface:#162027; --sunk:#1C2931; --ink:#E5EDF1; --muted:#97A8B2; --line:#283741;
  --accent:#FF7A2E; --accent-ink:#FF9C61; --accent-soft:#3A2113;
  --ok:#4CC78E; --ok-soft:#133428; --no:#FF8B74; --no-soft:#3A1C17;
  --stage:#192B36; --stage-ground:#3D5A69;
  --dog:#E2A957; --dog-dark:#B17A38; --dog-light:#EFCB8C; --nose:#1E140D; --treat:#E3A271; --skin:#D6A27C; --sleeve:#4A84A6; --pants:#58798B; --mat:#3E7A5D; --toy:#5DB1DC; --dog2:#9DAAB3; --dog2-dark:#6B7881; --dog2-light:#C3CDD3;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0E1418; --surface:#162027; --sunk:#1C2931; --ink:#E5EDF1; --muted:#97A8B2; --line:#283741;
  --accent:#FF7A2E; --accent-ink:#FF9C61; --accent-soft:#3A2113;
  --ok:#4CC78E; --ok-soft:#133428; --no:#FF8B74; --no-soft:#3A1C17;
  --stage:#192B36; --stage-ground:#3D5A69;
  --dog:#E2A957; --dog-dark:#B17A38; --dog-light:#EFCB8C; --nose:#1E140D; --treat:#E3A271; --skin:#D6A27C; --sleeve:#4A84A6; --pants:#58798B; --mat:#3E7A5D; --toy:#5DB1DC; --dog2:#9DAAB3; --dog2-dark:#6B7881; --dog2-light:#C3CDD3;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
button{font:inherit;color:inherit;-webkit-appearance:none;appearance:none;margin:0}
body{overflow-wrap:break-word}
section,main,.wrap{max-width:100%;overflow-x:clip}
h1,h2,h3{margin:0;text-wrap:balance}
p{margin:0}
.wrap{width:100%;max-width:620px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 120px}

/* top bar */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:6px 4px}
.brand{display:flex;align-items:center;gap:8px;min-width:0;white-space:nowrap;overflow:hidden;font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.brand svg{width:20px;height:20px;color:var(--accent)}
.dogchip{flex:0 1 auto;max-width:60%;display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px 6px 6px;font-size:13px;font-weight:600;cursor:pointer;min-width:0}
.dogchip .av{width:26px;height:26px;border-radius:50%;background:var(--accent-soft);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--f-display);font-size:12px;flex:none}
.dogchip .av.two{background:var(--sunk);color:var(--ink);margin-left:-16px;border:2px solid var(--surface);width:28px;height:28px}
.dogchip span.t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.view-head{padding-block:22px 18px;display:grid;gap:10px}
.eyebrow{font-family:var(--f-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent-ink)}
.h1{font-family:var(--f-display);font-weight:700;font-size:clamp(23px,6.4vw,34px);hyphens:auto;-webkit-hyphens:auto;line-height:1.12;letter-spacing:-.01em}
.lead{color:var(--muted);max-width:60ch}
.h2{font-family:var(--f-display);font-weight:500;font-size:19px;line-height:1.25}
.sec{display:grid;gap:12px;margin-top:28px}
.sec-label{font-family:var(--f-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px}
.muted{color:var(--muted)}
.small{font-size:14px}

/* profile */
.profile{display:grid;gap:12px}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fields .field:first-child{grid-column:1/-1}
.field{display:grid;gap:4px;min-width:0}
.field label{font-size:13px;color:var(--muted);font-weight:500}
.field input{-webkit-appearance:none;appearance:none;display:block;width:100%;max-width:100%;min-width:0;min-height:46px;line-height:1.3;text-align:left;font:inherit;font-size:16px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.field input::-webkit-date-and-time-value{text-align:left;margin:0}
.field input::-webkit-datetime-edit{padding:0}
.field input:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:12px;padding:11px 16px;font-weight:600;cursor:pointer;background:var(--accent);color:#fff}
.btn.ghost{background:var(--sunk);color:var(--ink)}
.btn:focus-visible,.icon-btn:focus-visible,.tab:focus-visible,.row:focus-visible,.chip:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.field.full,.check.full{grid-column:1/-1}
.flabel{font-size:13px;color:var(--muted);font-weight:500}
.seg2{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--sunk);padding:4px;border-radius:12px}
.seg2 label{position:relative;display:block;text-align:center;padding:10px 6px;border-radius:9px;font-weight:600;font-size:15px;color:var(--muted);cursor:pointer}
.seg2 label.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.seg2 input{position:absolute;inset:0;width:100%;height:100%;opacity:0;margin:0;cursor:pointer}
.seg2 label:focus-within{outline:2px solid var(--accent);outline-offset:1px}
.sketch-grid{display:grid;grid-template-columns:1fr;gap:6px}.sketch-grid .scene{border-radius:12px;overflow:hidden}.sketch-icons{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}.sketch-icons .row-ico{width:96px;height:96px}.sketch-icons svg{width:96px;height:96px}
.seg2.three{grid-template-columns:repeat(3,1fr)}.seg2.three label{font-size:13px;padding:10px 2px}
.ob-bar{padding-block:8px 0}
.alerts{display:grid;gap:8px;margin-bottom:4px}
.alert{background:var(--accent-soft);border-radius:12px;padding:10px 14px;font-size:14px}
.plan{display:grid;gap:8px}
.plan-item{display:grid;grid-template-columns:32px 1fr auto;gap:10px;align-items:start;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 10px 12px 12px}
.plan-item.on{opacity:.7}
.plan-item.on b{text-decoration:line-through;text-decoration-color:var(--line)}
.plan-check input{appearance:none;-webkit-appearance:none;width:28px;height:28px;border-radius:9px;border:2px solid var(--stage-ground);margin:0;display:grid;place-items:center;cursor:pointer;background:var(--surface)}
.plan-check input:checked{background:var(--ok);border-color:var(--ok)}
.plan-check input:checked::after{content:"";width:7px;height:13px;border:solid #fff;border-width:0 3px 3px 0;transform:translateY(-1px) rotate(45deg)}
.plan-check input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.plan-main{display:grid;gap:2px;min-width:0}
.plan-main b{font-weight:600}
.plan-main span{font-size:14px;color:var(--muted)}
.plan-go{border:0;background:var(--sunk);border-radius:10px;width:36px;height:36px;display:grid;place-items:center;cursor:pointer}
.jform{display:grid;gap:12px}
.jform .fields .field:first-child{grid-column:auto}
.field select{-webkit-appearance:none;appearance:none;display:block;width:100%;min-height:46px;font:inherit;font-size:16px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.steppers{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stepper{display:grid;gap:4px}
.stepper div{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;background:var(--bg);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.stepper button{border:0;background:none;height:44px;font-size:20px;cursor:pointer;color:var(--accent-ink)}
.stepper output{text-align:center;font-family:var(--f-mono);font-size:17px;font-variant-numeric:tabular-nums}
.stats{display:grid;gap:10px}
.stat-row{display:grid;grid-template-columns:minmax(0,1.2fr) 2fr 44px;gap:10px;align-items:center;font-size:14px}
.stat-name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat-bar{height:10px;border-radius:5px;background:var(--sunk);overflow:hidden}
.stat-bar i{display:block;height:100%;border-radius:5px}
.stat-bar i.good{background:var(--ok)}.stat-bar i.mid{background:var(--accent)}.stat-bar i.low{background:var(--no)}
.stat-num{font-family:var(--f-mono);font-size:13px;text-align:right;font-variant-numeric:tabular-nums}
.who{font-style:normal;display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;background:var(--sunk);font-size:11px;font-weight:700;margin-right:6px}
.log{display:grid;gap:6px}
.log-row{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:8px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 6px 8px 12px;font-size:14px}
.log-row > div{display:grid;gap:1px;min-width:0}
.log-score{font-family:var(--f-mono);font-size:13px}
.due{display:grid;gap:8px}
.due-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-left-width:5px;border-radius:12px;padding:10px 12px}
.due-row > div{display:grid;gap:1px;min-width:0}
.due-row.ok{border-left-color:var(--ok)}.due-row.soon{border-left-color:var(--accent)}.due-row.late{border-left-color:var(--no)}
.due-when{text-align:right;font-size:14px}
.due-row.late .due-when .small{color:var(--no);font-weight:600}
.emergency{display:grid;gap:8px}
.em{background:var(--no-soft);border-radius:12px;padding:10px 14px;display:grid;gap:2px;font-size:14px}
.em b{color:var(--no);font-size:15px}
.dots2{display:flex;gap:10px;flex-wrap:wrap}
.status-dots b{font-size:10px;font-weight:700;color:var(--muted);margin-right:3px;line-height:4px}
.status-dots{align-items:center}
.flabel + .seg{margin-top:4px}
.seg + .flabel{margin-top:10px;display:block}
.err{color:var(--no);font-weight:600;font-size:14px}
.onboard{position:fixed;inset:0;z-index:60;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.onboard .wrap{padding-bottom:48px}
.saved{font-size:13px;color:var(--ok);font-weight:600}

/* timeline */
.timeline{display:grid;gap:0;position:relative}
.tl-item{display:grid;grid-template-columns:28px 1fr;gap:12px}
.tl-rail{position:relative;display:flex;justify-content:center}
.tl-rail::before{content:"";position:absolute;top:0;bottom:0;width:2px;background:var(--line)}
.tl-item:first-child .tl-rail::before{top:22px}
.tl-item:last-child .tl-rail::before{bottom:calc(100% - 22px)}
.tl-dot{position:relative;margin-top:14px;width:16px;height:16px;border-radius:50%;background:var(--bg);border:2px solid var(--stage-ground)}
.tl-item.done .tl-dot{background:var(--ok);border-color:var(--ok)}
.tl-item.now .tl-dot{background:var(--accent);border-color:var(--accent);box-shadow:0 0 0 5px var(--accent-soft)}
.tl-body{padding-bottom:12px;min-width:0}
.stage{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.tl-item.now .stage{border-color:var(--accent)}
.stage-head{display:grid;width:100%;text-align:left;background:none;border:0;padding:14px 16px;display:grid;gap:4px;cursor:pointer}
.stage-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.range{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.badge{font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:2px 8px;border-radius:999px;background:var(--accent);color:#fff}
.badge.ok{background:var(--ok-soft);color:var(--ok)}
.stage-title{font-family:var(--f-display);font-weight:500;font-size:18px;line-height:1.25}
.stage-sub{color:var(--muted);font-size:14px}
.progress{display:flex;align-items:center;gap:8px;margin-top:6px}
.bar{flex:1;height:6px;border-radius:99px;background:var(--sunk);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok);border-radius:99px;transition:width .3s}
.progress span{font-family:var(--f-mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.stage-body{padding:0 16px 16px;display:grid;gap:16px}
.lead-box{background:var(--sunk);border-radius:12px;padding:12px 14px;font-size:15px}
.list-block{display:grid;gap:8px}
.list-title{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.list-title.do{color:var(--ok)}
.list-title.dont{color:var(--no)}
.list-title.neutral{color:var(--muted)}
.list-title.do,.list-title.dont,.list-title.neutral{margin:0}
ul.clean{list-style:none;margin:0;padding:0;display:grid;gap:8px}
ul.clean li{display:grid;grid-template-columns:18px 1fr;gap:8px;font-size:15px}
ul.clean li::before{content:"";width:7px;height:7px;border-radius:50%;margin-top:9px;margin-left:4px;background:var(--stage-ground)}
ul.do li::before{background:var(--ok)}
ul.dont li::before{background:var(--no);border-radius:1px;transform:rotate(45deg)}
.checks{display:grid;gap:6px}
.check{display:grid;grid-template-columns:24px 1fr;gap:10px;align-items:start;padding:8px 10px;border-radius:10px;background:var(--bg);cursor:pointer;font-size:15px}
.check input{appearance:none;-webkit-appearance:none;width:22px;height:22px;border-radius:7px;border:2px solid var(--stage-ground);margin:0;display:grid;place-items:center;cursor:pointer;background:var(--surface)}
.check input:checked{background:var(--ok);border-color:var(--ok)}
.check input:checked::after{content:"";width:6px;height:11px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:translateY(-1px) rotate(45deg)}
.check input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.check.on span{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--line)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:14px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.chip svg{width:14px;height:14px;color:var(--accent)}
.dog2 .dog-s{stroke:var(--dog2)}.dog2 .dog-f{fill:var(--dog2)}.dog2 .dog-far{stroke:var(--dog2-dark)}.dog2 .dog-ear{fill:var(--dog2-dark)}.dog2 .dog-far-f{fill:var(--dog2-dark)}.dog2 .dog-line{stroke:var(--dog2-dark)}.dog2 .dog-light{fill:var(--dog2-light)}.dog2 .dog-light-s{stroke:var(--dog2-light)}
.two-art{background:var(--stage);border-radius:14px;overflow:hidden}
.two-art svg{display:block;width:100%;height:auto}
.two-art figcaption{font-size:13px;color:var(--muted);padding:0 14px 12px}
.signals{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.signals>div{background:var(--bg);border-radius:14px;padding:12px 14px;display:grid;gap:8px;align-content:start;min-width:0}
.two-ico{display:inline-flex;gap:2px;color:var(--accent)}
.two-ico svg{width:16px;height:16px}
.two-ico svg+svg{color:var(--dog2)}
.heat-box{background:var(--accent-soft);border-radius:16px;padding:14px 16px;display:grid;gap:10px}
.heat-day{font-family:var(--f-display);font-weight:700;font-size:22px;line-height:1.15}
.heat-phase{font-weight:600}
.phasebar{position:relative;display:grid;grid-template-columns:9fr 9fr 6fr;gap:3px;padding-top:4px}
.phasebar i{height:8px;border-radius:4px;background:var(--surface)}
.phasebar i.on{background:var(--accent)}
.phasebar b{position:absolute;top:0;width:3px;height:16px;border-radius:2px;background:var(--ink);transform:translateX(-1px)}
.phase-legend{display:grid;grid-template-columns:9fr 9fr 6fr;gap:3px;font-size:11px;color:var(--muted);font-family:var(--f-mono)}
.facts{display:grid;gap:6px;margin:0}
.facts div{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;font-size:14px;border-top:1px solid var(--line);padding-top:6px}
.facts dt{color:var(--muted)}
.facts dd{margin:0;font-weight:600;text-align:right;font-variant-numeric:tabular-nums}
.heat-add{display:flex;gap:8px;flex-wrap:wrap;align-items:end}
.heat-add .field{flex:1 1 160px}
.hist{display:flex;flex-wrap:wrap;gap:6px}
.hist span{display:inline-flex;align-items:center;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px 4px 3px 10px;font-size:13px}
.hist button{border:0;background:none;color:var(--muted);cursor:pointer;padding:2px 6px;border-radius:99px;font-size:13px}
.phases{display:grid;gap:8px}
.phases div{display:grid;grid-template-columns:72px 1fr;gap:10px;background:var(--bg);border-radius:12px;padding:10px 12px;font-size:14px}
.phases b{font-family:var(--f-mono);font-size:12px;font-weight:500;color:var(--accent-ink);padding-top:2px}
.spay{display:grid;gap:8px}
.spay div{background:var(--bg);border-radius:12px;padding:10px 12px;display:grid;gap:2px;font-size:14px}
.spay b{font-weight:600;font-size:15px}
.note{font-size:14px;color:var(--muted);border-left:3px solid var(--stage-ground);padding-left:12px}

/* commands list */
.group{display:grid;gap:8px}
.rows{display:grid;gap:8px}
.row{width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:12px 14px;display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:center;cursor:pointer}
.row-ico{width:52px;height:52px;border-radius:14px;background:var(--stage);display:grid;place-items:center;overflow:hidden}
.row-ico svg{width:52px;height:52px}
.row-main{min-width:0;display:grid;gap:2px}
.row-name{font-family:var(--f-display);font-weight:500;font-size:16px}
.row-cue{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.status-dots{display:flex;gap:3px;margin-top:4px}
.status-dots i{width:16px;height:4px;border-radius:2px;background:var(--line)}
.status-dots i.on{background:var(--ok)}
.status-label{font-size:12px;color:var(--muted)}
.chev{width:18px;height:18px;color:var(--muted)}

/* sheet */
.sheet{position:fixed;inset:0;z-index:40;background:var(--bg);display:flex;flex-direction:column;animation:sheetIn .28s ease-out}
@keyframes sheetIn{from{transform:translateX(24px);opacity:.4}to{transform:none;opacity:1}}
.sheet-bar{flex:none;display:flex;align-items:center;gap:8px;padding-top:calc(env(safe-area-inset-top,0px) + 8px);padding-bottom:8px;padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--bg);border-bottom:1px solid var(--line)}
.icon-btn{border:0;background:none;display:inline-flex;align-items:center;gap:4px;padding:8px;border-radius:10px;cursor:pointer;color:var(--accent-ink);font-weight:600}
.icon-btn svg{width:22px;height:22px}
.sheet-title{font-family:var(--f-display);font-size:15px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.sheet-scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.sheet-scroll .wrap{padding-bottom:calc(40px + env(safe-area-inset-bottom,0px))}
.cmd-head{display:grid;gap:8px;padding-block:18px 14px}
.meta-row{display:flex;flex-wrap:wrap;gap:8px}
.pill{font-size:13px;padding:4px 10px;border-radius:999px;background:var(--sunk);color:var(--ink)}
.pill b{font-weight:600}

/* player */
.player{background:var(--surface);border:1px solid var(--line);border-radius:20px;overflow:hidden}
.scene{background:var(--stage);position:relative}
.scene svg{display:block;width:100%;height:auto;max-width:100%}
.player-ctl{display:flex;align-items:center;gap:10px;padding:12px 14px;border-top:1px solid var(--line);flex-wrap:wrap}
.steps-nav{display:flex;gap:6px;flex:1;flex-wrap:wrap}
.step-chip{width:36px;height:36px;border-radius:12px;border:1px solid var(--line);background:var(--bg);font-family:var(--f-mono);font-weight:500;cursor:pointer}
.step-chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.play{width:40px;height:40px;border-radius:50%;border:0;background:var(--accent);color:#fff;display:grid;place-items:center;cursor:pointer;flex:none}
.play svg{width:18px;height:18px}
.step-text{padding:4px 16px 16px;display:grid;gap:6px}
.step-text h3{font-family:var(--f-display);font-weight:500;font-size:17px}
.step-text p{font-size:15px}
.legend{display:flex;flex-wrap:wrap;gap:12px;padding:0 16px 14px;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:50%;display:inline-block}

.steplist{counter-reset:s;display:grid;gap:8px;margin:0;padding:0;list-style:none}
.steplist li{counter-increment:s}
.steplist button{width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:12px 14px;display:grid;grid-template-columns:28px 1fr;gap:10px;cursor:pointer}
.steplist button::before{content:counter(s);font-family:var(--f-mono);font-size:13px;width:26px;height:26px;border-radius:8px;background:var(--sunk);display:grid;place-items:center}
.steplist li.on button{border-color:var(--accent)}
.steplist li.on button::before{background:var(--accent);color:#fff}
.steplist b{display:block;font-weight:600}
.steplist span{font-size:14px;color:var(--muted)}
.ready{background:var(--ok-soft);border-radius:14px;padding:14px;display:grid;gap:4px}
.ready b{color:var(--ok);font-size:12px;letter-spacing:.06em;text-transform:uppercase}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:var(--sunk);padding:4px;border-radius:14px}
.seg button{border:0;background:none;border-radius:10px;padding:9px 4px;font-size:13px;line-height:1.2;min-width:0;font-weight:600;cursor:pointer;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}

/* off-leash */
.rules{display:grid;gap:10px}
.rule{display:grid;gap:4px;padding:14px 16px;border-radius:16px;background:var(--surface);border:1px solid var(--line)}
.rule b{font-weight:600}
.levels{display:grid;gap:12px;counter-reset:lv}
.level{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;display:grid;gap:10px}
.level.now{border-color:var(--accent)}
.level-top{display:grid;grid-template-columns:44px 1fr;gap:12px;align-items:start}
.lv-num{width:44px;height:44px;border-radius:14px;background:var(--sunk);display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:18px}
.level.now .lv-num{background:var(--accent);color:#fff}
.level.passed .lv-num{background:var(--ok);color:#fff}
.lv-title{font-family:var(--f-display);font-weight:500;font-size:17px;line-height:1.25}
.lv-where{font-size:14px;color:var(--muted)}
.crit{font-size:14px;background:var(--sunk);border-radius:10px;padding:8px 12px}
.crit b{font-weight:600}
.tracker{display:grid;gap:8px;border-top:1px dashed var(--line);padding-top:12px}
.tr-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tr-btn{border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:9px 12px;font-weight:600;font-size:14px;cursor:pointer}
.tr-btn.yes{color:var(--ok)}
.tr-btn.no{color:var(--no)}
.tr-dots{display:flex;gap:4px;flex:1;min-width:130px}
.tr-dots i{width:12px;height:12px;border-radius:50%;background:var(--sunk);border:1px solid var(--line)}
.tr-dots i.y{background:var(--ok);border-color:var(--ok)}
.tr-dots i.n{background:var(--no);border-color:var(--no)}
.tr-score{font-family:var(--f-mono);font-size:13px;font-variant-numeric:tabular-nums}
.tr-reset{border:0;background:none;color:var(--muted);font-size:13px;cursor:pointer;text-decoration:underline;padding:4px}
details.faq{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:0 16px}
details.faq summary{cursor:pointer;list-style:none;padding:14px 0;font-weight:600;display:flex;justify-content:space-between;gap:12px}
details.faq summary::-webkit-details-marker{display:none}
details.faq summary::after{content:"+";font-family:var(--f-mono);color:var(--accent-ink);font-size:18px;line-height:1}
details.faq[open] summary::after{content:"–"}
details.faq .faq-body{padding-bottom:14px;display:grid;gap:8px;font-size:15px}

/* basics */
.principles{display:grid;gap:10px}
.pr{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px;display:grid;gap:4px}
.pr h3{font-family:var(--f-display);font-weight:500;font-size:16px}
.pr p{font-size:15px;color:var(--ink)}
.three-d{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
@media (max-width:540px){.three-d{grid-template-columns:1fr}.three-d div{grid-template-columns:120px 1fr;align-items:baseline;gap:8px}}
.three-d div{background:var(--sunk);border-radius:12px;padding:10px;display:grid;gap:2px;min-width:0}
.three-d b{font-family:var(--f-display);font-weight:500;font-size:14px}
.three-d span{font-size:12px;color:var(--muted)}
ol.howto{margin:0;padding:0;list-style:none;counter-reset:h;display:grid;gap:8px}
ol.howto li{counter-increment:h;display:grid;grid-template-columns:28px 1fr;gap:10px;font-size:15px}
ol.howto li::before{content:counter(h);width:26px;height:26px;border-radius:8px;background:var(--accent-soft);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--f-mono);font-size:13px}

/* tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
.tabbar-in{max-width:620px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tab{border:0;background:none;padding:9px 0 8px;display:grid;justify-items:center;gap:3px;font-size:10.5px;white-space:nowrap;font-weight:600;color:var(--muted);cursor:pointer}
.tab svg{width:24px;height:24px}
.tab.on{color:var(--accent-ink)}

/* scene svg */
.g-line{stroke:var(--stage-ground);stroke-width:2}
.g-ticks{stroke:var(--stage-ground);stroke-width:2;stroke-dasharray:3 21;stroke-linecap:round}
.mat{fill:var(--mat)}
.p-torso{fill:var(--sleeve)}
.p-leg{stroke:var(--pants);stroke-width:13;stroke-linecap:round;fill:none}
.p-shoe{fill:var(--ink)}
.p-arm{stroke:var(--sleeve);stroke-width:12;stroke-linecap:round;fill:none}
.skin{fill:var(--skin)}
.dog-far{stroke:var(--dog-dark);stroke-width:11;stroke-linecap:round;stroke-linejoin:round;fill:none}
.dog-s{stroke:var(--dog);stroke-linecap:round;stroke-linejoin:round;fill:none}
.dog-f{fill:var(--dog)}
.dog-ear{fill:var(--dog-dark)}
.dog-light{fill:var(--dog-light)}
.nose-f{fill:var(--nose)}
.dog-far-f{fill:var(--dog-dark)}
.dog-line{stroke:var(--dog-dark);stroke-width:1.7;fill:none;stroke-linecap:round}
.dog-light-s{stroke:var(--dog-light);stroke-linecap:round;stroke-linejoin:round;fill:none}
.ink-f{fill:var(--ink)}
.collar{stroke:var(--accent);stroke-width:5;stroke-linecap:round}
.toy{fill:var(--toy)}
.treat{fill:var(--treat)}
.leash{fill:none;stroke:var(--accent);stroke-width:3;stroke-linecap:round}
.leash.long{stroke:var(--toy);stroke-width:2.5}
.arm{stroke:var(--sleeve);stroke-width:13;stroke-linecap:round;fill:none}
.knuckle{stroke:var(--dog-dark);stroke-width:1.5;stroke-linecap:round;opacity:.5}
.bub{fill:var(--surface);stroke:var(--line);stroke-width:1}
.bub-t{fill:var(--ink);font-family:var(--f-body);font-weight:600;font-size:15px}
.mark-b{fill:var(--ok)}
.mark-t{fill:#fff;font-family:var(--f-body);font-weight:700;font-size:15px}
.tiny-t{fill:var(--muted);font-family:var(--f-mono);font-size:10px}

@media (prefers-reduced-motion: reduce){.sheet{animation:none}.bar i{transition:none}}
</style>
</head>

<script>
(function(){
"use strict";

/* ---------- storage ---------- */
var KEY = "vosp-sobaki-v1";
var S = {name:"", sex:"", fixed:false, breed:"", size:"", birth:"", home:"", cmd2:{}, log:[], health:[], done:{}, d2:{has:false, name:"", sex:"", birth:"", fixed:false}, onboarded:false, checks:{}, cmd:{}, rec:{}, pre:{}, heat:[]};
try { var raw = localStorage.getItem(KEY); if (raw) { var o = JSON.parse(raw); for (var k in o) S[k] = o[k]; } } catch(e) {}
["cmd2","done"].forEach(function(k){ if (!S[k] || typeof S[k] !== "object") S[k] = {}; });
["log","health","heat"].forEach(function(k){ if (!Array.isArray(S[k])) S[k] = []; });
if (!S.d2 || typeof S.d2 !== "object") S.d2 = {has:false, name:"", sex:"", birth:"", fixed:false};
if (!Array.isArray(S.heat)) S.heat = [];
function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e) {} }
function dogName(){ return (S.name || "").trim() || "Собака"; }
function decl(w, sex, c){
  if (!w || !c || /\s/.test(w)) return w;
  var last = w.slice(-1).toLowerCase(), pre = w.slice(-2,-1).toLowerCase(), stem = w.slice(0,-1);
  if (last === "а"){ var gi = /[гкхжшчщ]/.test(pre) ? "и" : "ы"; return {g:stem+gi, d:stem+"е", a:stem+"у", i:stem+(/[жшчщц]/.test(pre)?"ей":"ой"), p:stem+"е"}[c]; }
  if (last === "я"){ if (pre === "и") return {g:stem+"и", d:stem+"и", a:stem+"ю", i:stem+"ей", p:stem+"и"}[c]; return {g:stem+"и", d:stem+"е", a:stem+"ю", i:stem+"ей", p:stem+"е"}[c]; }
  if (sex === "m"){
    if (last === "й" || last === "ь") return {g:stem+"я", d:stem+"ю", a:stem+"я", i:stem+"ем", p:stem+"е"}[c];
    if (/[бвгджзклмнпрстфхцчшщ]/.test(last)) return {g:w+"а", d:w+"у", a:w+"а", i:w+(/[жшчщц]/.test(last)?"ем":"ом"), p:w+"е"}[c];
  }
  return w;
}
function dogObj(i){ return i === 1 ? {name: dogName(), sex: S.sex || "f"} : {name: ((S.d2 && S.d2.name) || "").trim() || "Вторая собака", sex: (S.d2 && S.d2.sex) || "m"}; }
function tpl(str){
  var d1 = dogObj(1), d2 = dogObj(2), m = d2, w = d1;
  if (d1.sex !== d2.sex){ m = d1.sex === "m" ? d1 : d2; w = d1.sex === "f" ? d1 : d2; }
  var map = {n1:d1, n2:d2, nm:m, nw:w};
  return String(str)
    .replace(/\{name\}/g, d1.name).replace(/\{name2\}/g, d2.name)
    .replace(/\{(n1|n2|nm|nw)(?:\.([gdaip]))?\}/g, function(_, k, c){ var d = map[k]; return c ? decl(d.name, d.sex, c) : d.name; })
    .replace(/\{f([12]):([^|}]*)\|([^}]*)\}/g, function(_, i, a, b){ return dogObj(+i).sex === "f" ? a : b; })
    .replace(/\{age2\}/g, ageOf(S.d2 && S.d2.birth));
}
function heatApplies(){ return S.sex === "f" && !S.fixed; }

/* ---------- content: stages ---------- */
var STAGES = [
 { id:"s1", range:"День 1–3", title:"Первые дни дома", sub:"Безопасность, сон и распорядок",
   lead:"Команды учить ещё рано. Главное сейчас — чтобы собака почувствовала себя в безопасности и поняла распорядок: где спать, где есть, куда ходить в туалет.",
   do:["Выносите в туалет после сна, еды, игры и каждые 1–2 часа (щенка). Сразу после — похвала и лакомство.",

   dont:["Ругать за лужи и тыкать носом. Собака не связывает наказание с тем, что сделала раньше, и начинает прятаться, чтобы сходить в туалет.",
         "Оставлять одну надолго в первый же день.",
         "Подзывать, чтобы сделать неприятное: стричь когти, купать, закрыть."],
   note:"Взрослой собаке из приюта нужно больше времени. Ориентир «3–3–3»: около 3 дней на стресс, 3 недели на привыкание к распорядку и 3 месяца, чтобы почувствовать себя дома.",

   cmds:[] },
 { id:"s2", range:"8–12 недель", title:"Социализация и первые навыки", sub:"Самое важное окно в жизни собаки",
   lead:"Период социализации закрывается примерно к 12–14 неделям. Всё, с чем щенок спокойно познакомится сейчас, станет для него нормой на всю жизнь.",
   do:["Каждый день — что-то новое: люди в шапках и очках, дети, зонт, пылесос, звук машин, лифт, разные поверхности. Коротко и с лакомством.",
       "Приучайте к рукам: трогайте лапы, уши, смотрите зубы и сразу награждайте.",

       "Занятия по 3–5 минут, 3–4 раза в день. Заканчивайте на удачном повторе."],

  $("jl-add").addEventListener("click", function(){
    var dog = has2 ? (+radioVal("jl-dog") || 1) : 1; jl.dog = dog;
    S.log = S.log || []; S.log.unshift({id: Date.now().toString(36), d: isoDay(), dog: dog, cmd: $("jl-cmd").value, place: $("jl-place").value, ok: jl.ok, n: jl.n, note: $("jl-note").value.trim()});
    if (S.log.length > 500) S.log.length = 500;
    save(); keepScroll(renderToday); var m = $("jl-ok-msg"); if (m){ m.hidden = false; setTimeout(function(){ if (m.isConnected) m.hidden = true; }, 1500); }
  });
  v.querySelectorAll("[data-logdel]").forEach(function(b){ b.addEventListener("click", function(){ var id = b.getAttribute("data-logdel"); S.log = S.log.filter(function(e){ return e.id !== id; }); save(); keepScroll(renderToday); }); });
}

/* ---------- health view ---------- */
var hf = {dog:1, type:"vac"};
function renderHealth(){
  var has2 = !!(S.d2 && S.d2.has), due = healthDue();
  var html = '<div class="view-head"><div class="eyebrow">Здоровье</div><h1 class="h1">Прививки, обработки и уход</h1>' +
    '<p class="lead">Отмечайте прививки и обработки — приложение посчитает, когда следующие, и напомнит на экране «Сегодня» за неделю.</p></div>';
  html += '<div class="sec"><div class="sec-label">Ближайшие даты</div>';
  if (!due.length) html += '<div class="card"><p class="small muted">Пока пусто. Добавьте последнюю прививку и обработку от клещей и глистов ниже.</p></div>';
  else html += '<div class="due">' + due.map(function(x){ return '<div class="due-row '+x.state+'"><div><b>'+esc(hTitle(x.r))+'</b>'+(has2?'<span class="small muted">'+esc(dogLabel(x.r.dog))+'</span>':'')+'</div><div class="due-when"><span>'+fmtD(x.next, true)+'</span><span class="small">'+dueLabel(x)+'</span></div></div>'; }).join("") + '</div>';
  html += '</div>';
  html += '<div class="sec"><div class="sec-label">Добавить запись</div><div class="card jform">' +
    (has2 ? '<div class="field full"><span class="flabel">Собака</span>'+dogSeg("hf-dog", hf.dog)+'</div>' : '') +
    '<div class="fields"><div class="field"><label for="hf-type">Что сделали</label><select id="hf-type">'+HTYPES.map(function(x){ return '<option value="'+x.id+'"'+(x.id===hf.type?' selected':'')+'>'+x.t+'</option>'; }).join("")+'</select></div>' +
    '<div class="field"><label for="hf-date">Когда</label><input id="hf-date" type="date" value="'+isoDay()+'" max="'+isoDay()+'"></div>' +
    '<div class="field"><label for="hf-every">Повторять через, дней</label><input id="hf-every" type="number" inputmode="numeric" min="0" max="730" value="'+HTYPE[hf.type].every+'"></div>' +
    '<div class="field"><label for="hf-note">Препарат или заметка</label><input id="hf-note" type="text" maxlength="60" autocomplete="off" placeholder="Например, название таблетки"></div></div>' +
    '<p class="small muted">Интервал обработок зависит от препарата: у одних средств от клещей — месяц, у других — 3 месяца. Смотрите инструкцию. 0 — без повтора.</p>' +
    '<div><button class="btn" type="button" id="hf-add">Добавить</button></div></div></div>';
  var hist = (S.health||[]).slice().sort(function(a,b){ return a.date < b.date ? 1 : -1; }).slice(0, 15);
  if (hist.length) html += '<div class="sec"><div class="sec-label">История</div><div class="log">' + hist.map(function(r){
    return '<div class="log-row"><div><span><b>'+esc(HTYPE[r.type].t)+'</b>'+(has2?' · '+esc(dogLabel(r.dog)):'')+'</span><span class="small muted">'+fmtD(parseDate(r.date), true)+(r.note?' — '+esc(r.note):'')+'</span></div><span></span><button class="tr-reset" type="button" data-hdel="'+r.id+'" aria-label="Удалить запись">✕</button></div>'; }).join("") + '</div></div>';
  html += '<div class="sec"><div class="sec-label">Прививки щенку</div><div class="card"><p class="small">Щенков обычно прививают несколько раз с интервалом 3–4 недели, примерно с 8 до 16 недель, затем ревакцинация через год. Прививка от бешенства — по правилам вашей страны, она часто нужна и для поездок. Точную схему, а также когда начинать обработки от клещей и глистов, составит ветеринар.</p></div></div>';
  html += '<div class="sec"><div class="sec-label">Срочно к ветеринару</div><div class="emergency">' + EMERGENCY.map(function(e){ return '<div class="em"><b>'+e[0]+'</b><span>'+e[1]+'</span></div>'; }).join("") +
    '<p class="small muted">Норма: температура 37,5–39,0 °C, дёсны розовые и влажные; если нажать на десну, цвет возвращается за 1–2 секунды. Запишите телефон своей клиники и ближайшей круглосуточной.</p></div></div>';
  var tp = TOPICS.filter(function(t){ return t.area === "health"; }).map(topicCard).join("");
  html += '<div class="sec"><div class="sec-label">Уход, кормление, нагрузка</div>' + tp + '</div>';
  var v = $("v-health"); v.innerHTML = html; bindSeg(v); bindCommon(v); bindTopics(v);
  $("hf-type").addEventListener("change", function(){ hf.type = this.value; $("hf-every").value = HTYPE[hf.type].every; });
  $("hf-add").addEventListener("click", function(){
    var d = $("hf-date").value; if (!d) return;
    var dog = has2 ? (+radioVal("hf-dog") || 1) : 1; hf.dog = dog;
    S.health = S.health || []; S.health.push({id: Date.now().toString(36), dog: dog, type: $("hf-type").value, date: d, every: Math.max(0, +$("hf-every").value || 0), note: $("hf-note").value.trim()});
    save(); keepScroll(function(){ renderHealth(); renderToday(); });
  });
  v.querySelectorAll("[data-hdel]").forEach(function(b){ b.addEventListener("click", function(){ var id = b.getAttribute("data-hdel"); S.health = S.health.filter(function(r){ return r.id !== id; }); save(); keepScroll(function(){ renderHealth(); renderToday(); }); }); });
}
function bindTopics(v){
  v.querySelectorAll("[data-topic]").forEach(function(b){ b.addEventListener("click", function(){ var id=b.getAttribute("data-topic"); openTopic[id] = !openTopic[id]; keepScroll(function(){ renderPath(); renderHealth(); }); }); });
}

/* ---------- basics card (in Path) ---------- */
var openBasics = false;
function basicsCard(){
  var h = '<article class="stage" id="basics-card"><button class="stage-head" type="button" data-basics aria-expanded="'+openBasics+'">' +
    '<span class="stage-meta"><span class="range">Основы</span></span><span class="stage-title">Как собака учится</span><span class="stage-sub">Шесть принципов, правило трёх «Д», сигналы стресса</span></button>';
  if (openBasics){
    h += '<div class="stage-body"><div class="principles">' + PRINCIPLES.map(function(p){ return '<div class="pr"><h3>'+p[0]+'</h3><p>'+p[1]+'</p></div>'; }).join("") + '</div>' +
      '<div class="list-block"><div class="list-title neutral">Правило трёх «Д»</div><p class="small">Любую команду усложняют по трём направлениям. Меняйте только одно за раз, остальные два на это время сделайте полегче.</p>' +
      '<div class="three-d"><div><b>Длительность</b><span>2 сек → 10 → 30 → минута</span></div><div><b>Дистанция</b><span>1 шаг → 3 → 5 м → корда</span></div><div><b>Отвлечения</b><span>дом → двор → парк → собаки</span></div></div></div>' +
      '<div class="list-block"><div class="list-title neutral">Сигналы стресса — пора сделать паузу</div><ul class="clean">'+STRESS.map(function(s){ return '<li>'+s+'</li>'; }).join("")+'</ul>' +
      '<p class="small muted">Увидели 2–3 таких сигнала — отойдите подальше от раздражителя, дайте собаке понюхать землю, закончите занятие простой командой.</p></div>' +
      '<p class="note">Это справочник для обычного воспитания. Если собака проявляет агрессию, сильный страх или не может оставаться одна, обратитесь к кинологу, который работает методами положительного подкрепления, или к ветеринарному поведенческому специалисту.</p></div>';
  }
  return h + '</article>';
}

/* ---------- command sheet ---------- */
var sheetOpen = false, cmdPlayer = null, cmdId = null, cmdStep = 0, playing = true;
function openCmd(id){
  var c = CMD[id]; if (!c) return;
  cmdId = id; cmdStep = 0; playing = true; sheetOpen = true;
  if (offPlayer) offPlayer.stop();
  $("sheet-title").textContent = c.name;
  var html = '<div class="cmd-head"><div class="eyebrow">'+c.group+'</div><h2 class="h1">'+c.name+'</h2>' +
    '<div class="meta-row"><span class="pill">Сигнал: <b>'+nm(c.cue)+'</b></span><span class="pill">Возраст: <b>'+c.age+'</b></span></div>' +
    '<p class="lead">'+c.why+'</p></div>' +
    '<div class="player"><div class="scene" id="cmd-scene"></div>' +
      '<div class="player-ctl"><div class="steps-nav" role="tablist" aria-label="Шаги">'+c.steps.map(function(s,i){ return '<button class="step-chip'+(i===0?' on':'')+'" type="button" role="tab" data-step="'+i+'" aria-label="Шаг '+(i+1)+'">'+(i+1)+'</button>'; }).join("")+'</div>' +
      '<button class="play" id="play" type="button" aria-label="Пауза">'+ICON_PAUSE+'</button></div>' +
      '<div class="step-text" id="step-text"></div>' +
      '<div class="legend"><span><i style="background:var(--ok)"></i>маркер «Да!»</span><span><i style="background:var(--treat)"></i>лакомство</span><span><i style="background:var(--accent)"></i>ошейник и поводок</span></div>' +
    '</div>' +
    '<div class="sec"><div class="sec-label">Все шаги</div><ol class="steplist" id="steplist">'+c.steps.map(function(s,i){ return '<li class="'+(i===0?'on':'')+'"><button type="button" data-step="'+i+'"><span><b>'+s.t+'</b><span>'+nm(s.d)+'</span></span></button></li>'; }).join("")+'</ol></div>' +
    '<div class="sec"><div class="sec-label">Частые ошибки</div><div class="card"><ul class="clean dont">'+c.mistakes.map(function(m){return '<li>'+m+'</li>';}).join("")+'</ul></div></div>' +
    '<div class="sec"><div class="ready"><b>Команда готова, когда</b><span>'+c.ready+'</span></div></div>' +
    '<div class="sec"><div class="sec-label">Ваш прогресс</div>' + (S.d2 && S.d2.has ? [1,2] : [1]).map(function(n){
      var cur = n === 1 ? (S.cmd[id]||0) : ((S.cmd2||{})[id]||0);
      return (S.d2 && S.d2.has ? '<div class="flabel">'+esc(dogLabel(n))+'</div>' : '') + '<div class="seg" role="radiogroup" aria-label="Статус команды">'+STATUS.map(function(s,i){ return '<button type="button" role="radio" aria-checked="'+(i===cur)+'" class="'+(i===cur?'on':'')+'" data-status="'+i+'" data-dog="'+n+'">'+s+'</button>'; }).join("")+'</div>';
    }).join("") + '</div>';
  $("sheet-body").innerHTML = html;
  var sh = $("sheet"); sh.hidden = false; $("sheet-scroll").scrollTop = 0;
  document.body.style.overflow = "hidden";
  cmdPlayer = new Player($("cmd-scene"));
  setStep(0);
  $("sheet-body").querySelectorAll("[data-step]").forEach(function(b){ b.addEventListener("click", function(){ setStep(+b.getAttribute("data-step")); if (b.closest("#steplist")) $("cmd-scene").scrollIntoView({behavior: RM?"auto":"smooth", block:"start"}); }); });
  $("play").addEventListener("click", function(){ playing = !playing; if (playing) cmdPlayer.play(); else cmdPlayer.stop(); updPlay(); });
  $("sheet-body").querySelectorAll("[data-status]").forEach(function(b){ b.addEventListener("click", function(){
    var dn = b.getAttribute("data-dog"); if (dn === "2") S.cmd2[cmdId] = +b.getAttribute("data-status"); else S.cmd[cmdId] = +b.getAttribute("data-status"); save();
    $("sheet-body").querySelectorAll('[data-status][data-dog="'+dn+'"]').forEach(function(x){ var on = x===b; x.classList.toggle("on", on); x.setAttribute("aria-checked", on); });
    renderCommands(); renderToday();
  }); });
  $("sheet-back").focus({preventScroll:true});
}
function setStep(i){
  var c = CMD[cmdId]; cmdStep = i;
  cmdPlayer.stop(); cmdPlayer.pausedAt = 0; cmdPlayer.load(c.steps[i].a, c.scene);
  if (playing) cmdPlayer.play();
  $("step-text").innerHTML = '<h3>Шаг '+(i+1)+'. '+c.steps[i].t+'</h3><p>'+nm(c.steps[i].d)+'</p>';
  $("sheet-body").querySelectorAll(".step-chip").forEach(function(b,j){ b.classList.toggle("on", j===i); b.setAttribute("aria-selected", j===i); });
  $("sheet-body").querySelectorAll("#steplist li").forEach(function(li,j){ li.classList.toggle("on", j===i); });
  updPlay();
}
function updPlay(){ var b=$("play"); if(!b) return; b.innerHTML = playing ? ICON_PAUSE : ICON_PLAY; b.setAttribute("aria-label", playing ? "Пауза" : "Смотреть анимацию"); }
function closeCmd(){
  if (cmdPlayer){ cmdPlayer.stop(); cmdPlayer = null; }
  sheetOpen = false; $("sheet").hidden = true; document.body.style.overflow = "";
  if (currentTab==="offleash" && offPlayer) offPlayer.play();
}
$("sheet-back").addEventListener("click", closeCmd);
document.addEventListener("keydown", function(e){ if (e.key!=="Escape") return; if (sheetOpen) closeCmd(); else if (S.onboarded && !$("onboard").hidden) closeOnboard(); });

/* ---------- tabs ---------- */
var currentTab = "today";
function setTab(t){
  currentTab = t;
  document.querySelectorAll("[data-view]").forEach(function(s){ s.hidden = s.getAttribute("data-view")!==t; });
  document.querySelectorAll(".tab").forEach(function(b){ var on=b.getAttribute("data-tab")===t; b.classList.toggle("on", on); if(on) b.setAttribute("aria-current","page"); else b.removeAttribute("aria-current"); });
  if (offPlayer){ if (t==="offleash" && !sheetOpen) offPlayer.play(); else offPlayer.stop(); }
  window.scrollTo(0,0);
}
document.querySelectorAll(".tab").forEach(function(b){ b.addEventListener("click", function(){ if (sheetOpen) closeCmd(); setTab(b.getAttribute("data-tab")); }); });
$("dogchip").addEventListener("click", function(){ openOnboard("profile"); });
document.addEventListener("visibilitychange", function(){
  if (document.hidden){ if (cmdPlayer) cmdPlayer.stop(); if (offPlayer) offPlayer.stop(); }
  else { if (sheetOpen && cmdPlayer && playing) cmdPlayer.play(); else if (currentTab==="offleash" && offPlayer) offPlayer.play(); }
});

function renderAll(){ renderChip(); renderToday(); renderPath(); renderCommands(); renderOff(); renderHealth(); }
renderAll();
if (location.hash === "#sketch"){
  /* drawing preview: every pose at large size */
  var app = $("app"); app.innerHTML = '<div class="sketch-grid" id="skg"></div><div class="sketch-icons" id="ski"></div>';
  [["stand",{}],["sit",{}],["down",{}],["sniff",{}],["look",{hand:[220,50],tr:1}],["up",{}],["stand",{walk:2}],["alert",{toy:"mouth"}],["sitlow",{}]].forEach(function(q){
    var c = document.createElement("div"); c.className = "scene"; $("skg").appendChild(c);
    var pl = new Player(c); pl.load([Object.assign({p:q[0], d:1, h:99999}, q[1])]);
  });
  ["stand","sit","down","bow","sniff","up"].forEach(function(n){ var d = document.createElement("div"); d.className = "row-ico"; d.innerHTML = poseIcon(n); $("ski").appendChild(d); });
} else if (!S.onboarded) openOnboard();
var h = (location.hash||"").replace("#","");
if (h==="sketch"){}
else if (["today","path","commands","offleash","health"].indexOf(h) >= 0) setTab(h);
else if (h==="basics"){ setTab("path"); openBasics = true; renderPath(); var bc=$("basics-card"); if(bc) bc.scrollIntoView(); }
else if (h==="profile"){ openOnboard("profile"); }
else if (["sleep","alone","treats","chew","problems","games"].indexOf(h) >= 0){ setTab("path"); openTopic[h] = true; renderPath(); var tt=$("topic-"+h); if(tt) tt.scrollIntoView(); }
else if (h==="heat"){ setTab("path"); openHeat = true; renderPath(); var hc=$("heat-card"); if(hc) hc.scrollIntoView(); }
else if (h==="two"){ setTab("path"); openTwo = true; renderPath(); var tc=$("two-card"); if(tc) tc.scrollIntoView(); }
else if (CMD[h]) openCmd(h);
})();
</script>

</body>
</html>
