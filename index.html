<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#EBF1F4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1418" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font-size:14px;font-family:system-ui,-apple-system,sans-serif}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<title>Воспитание собаки</title>
<meta name="apple-mobile-web-app-title" content="Собака">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=JetBrains+Mono:wght@500&family=Unbounded:wght@500;700&display=swap">
<style>
/* Layout: phone app — one column, fixed bottom tab bar, command details slide in as a full-screen sheet */
:root{
  --bg:#EBF1F4; --surface:#FFFFFF; --sunk:#DFE8ED; --ink:#15212A; --muted:#566874; --line:#CFDBE1;
  --accent:#EE5A0A; --accent-ink:#B4400A; --accent-soft:#FFE6D6;
  --ok:#1B7F52; --ok-soft:#D8F0E3; --no:#B0331D; --no-soft:#FBE2DC;
  --stage:#D7E8F0; --stage-ground:#93B1C0;
  --dog:#C8864A; --dog-dark:#8C5828; --treat:#6E3413; --skin:#EBBB93; --sleeve:#33627D; --pants:#2C4654; --mat:#86B49A; --toy:#2C7DA6; --dog2:#7A8790; --dog2-dark:#4F5B63;
  --f-display:"Unbounded","Golos Text",system-ui,sans-serif;
  --f-body:"Golos Text",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1418; --surface:#162027; --sunk:#1C2931; --ink:#E5EDF1; --muted:#97A8B2; --line:#283741;
  --accent:#FF7A2E; --accent-ink:#FF9C61; --accent-soft:#3A2113;
  --ok:#4CC78E; --ok-soft:#133428; --no:#FF8B74; --no-soft:#3A1C17;
  --stage:#192B36; --stage-ground:#3D5A69;
  --dog:#D59A5E; --dog-dark:#9F6838; --treat:#E3A271; --skin:#D6A27C; --sleeve:#4A84A6; --pants:#58798B; --mat:#3E7A5D; --toy:#5DB1DC; --dog2:#9DAAB3; --dog2-dark:#6B7881;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0E1418; --surface:#162027; --sunk:#1C2931; --ink:#E5EDF1; --muted:#97A8B2; --line:#283741;
  --accent:#FF7A2E; --accent-ink:#FF9C61; --accent-soft:#3A2113;
  --ok:#4CC78E; --ok-soft:#133428; --no:#FF8B74; --no-soft:#3A1C17;
  --stage:#192B36; --stage-ground:#3D5A69;
  --dog:#D59A5E; --dog-dark:#9F6838; --treat:#E3A271; --skin:#D6A27C; --sleeve:#4A84A6; --pants:#58798B; --mat:#3E7A5D; --toy:#5DB1DC; --dog2:#9DAAB3; --dog2-dark:#6B7881;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
button{font:inherit;color:inherit;-webkit-appearance:none;appearance:none;margin:0}
body{overflow-wrap:break-word}
section,main,.wrap{max-width:100%;overflow-x:clip}
h1,h2,h3{margin:0;text-wrap:balance}
p{margin:0}
.wrap{width:100%;max-width:620px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 120px}

/* top bar */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:6px 4px}
.brand{display:flex;align-items:center;gap:8px;min-width:0;white-space:nowrap;overflow:hidden;font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.brand svg{width:20px;height:20px;color:var(--accent)}
.dogchip{flex:0 1 auto;max-width:60%;display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px 6px 6px;font-size:13px;font-weight:600;cursor:pointer;min-width:0}
.dogchip .av{width:26px;height:26px;border-radius:50%;background:var(--accent-soft);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--f-display);font-size:12px;flex:none}
.dogchip span.t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.view-head{padding-block:22px 18px;display:grid;gap:10px}
.eyebrow{font-family:var(--f-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent-ink)}
.h1{font-family:var(--f-display);font-weight:700;font-size:clamp(23px,6.4vw,34px);hyphens:auto;-webkit-hyphens:auto;line-height:1.12;letter-spacing:-.01em}
.lead{color:var(--muted);max-width:60ch}
.h2{font-family:var(--f-display);font-weight:500;font-size:19px;line-height:1.25}
.sec{display:grid;gap:12px;margin-top:28px}
.sec-label{font-family:var(--f-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px}
.muted{color:var(--muted)}
.small{font-size:14px}

/* profile */
.profile{display:grid;gap:12px}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fields .field:first-child{grid-column:1/-1}
.field{display:grid;gap:4px;min-width:0}
.field label{font-size:13px;color:var(--muted);font-weight:500}
.field input{-webkit-appearance:none;appearance:none;display:block;width:100%;max-width:100%;min-width:0;min-height:46px;line-height:1.3;text-align:left;font:inherit;font-size:16px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.field input::-webkit-date-and-time-value{text-align:left;margin:0}
.field input::-webkit-datetime-edit{padding:0}
.field input:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:12px;padding:11px 16px;font-weight:600;cursor:pointer;background:var(--accent);color:#fff}
.btn.ghost{background:var(--sunk);color:var(--ink)}
.btn:focus-visible,.icon-btn:focus-visible,.tab:focus-visible,.row:focus-visible,.chip:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.saved{font-size:13px;color:var(--ok);font-weight:600}

/* timeline */
.timeline{display:grid;gap:0;position:relative}
.tl-item{display:grid;grid-template-columns:28px 1fr;gap:12px}
.tl-rail{position:relative;display:flex;justify-content:center}
.tl-rail::before{content:"";position:absolute;top:0;bottom:0;width:2px;background:var(--line)}
.tl-item:first-child .tl-rail::before{top:22px}
.tl-item:last-child .tl-rail::before{bottom:calc(100% - 22px)}
.tl-dot{position:relative;margin-top:14px;width:16px;height:16px;border-radius:50%;background:var(--bg);border:2px solid var(--stage-ground)}
.tl-item.done .tl-dot{background:var(--ok);border-color:var(--ok)}
.tl-item.now .tl-dot{background:var(--accent);border-color:var(--accent);box-shadow:0 0 0 5px var(--accent-soft)}
.tl-body{padding-bottom:12px;min-width:0}
.stage{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.tl-item.now .stage{border-color:var(--accent)}
.stage-head{display:grid;width:100%;text-align:left;background:none;border:0;padding:14px 16px;display:grid;gap:4px;cursor:pointer}
.stage-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.range{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.badge{font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:2px 8px;border-radius:999px;background:var(--accent);color:#fff}
.badge.ok{background:var(--ok-soft);color:var(--ok)}
.stage-title{font-family:var(--f-display);font-weight:500;font-size:18px;line-height:1.25}
.stage-sub{color:var(--muted);font-size:14px}
.progress{display:flex;align-items:center;gap:8px;margin-top:6px}
.bar{flex:1;height:6px;border-radius:99px;background:var(--sunk);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok);border-radius:99px;transition:width .3s}
.progress span{font-family:var(--f-mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.stage-body{padding:0 16px 16px;display:grid;gap:16px}
.lead-box{background:var(--sunk);border-radius:12px;padding:12px 14px;font-size:15px}
.list-block{display:grid;gap:8px}
.list-title{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.list-title.do{color:var(--ok)}
.list-title.dont{color:var(--no)}
.list-title.neutral{color:var(--muted)}
ul.clean{list-style:none;margin:0;padding:0;display:grid;gap:8px}
ul.clean li{display:grid;grid-template-columns:18px 1fr;gap:8px;font-size:15px}
ul.clean li::before{content:"";width:7px;height:7px;border-radius:50%;margin-top:9px;margin-left:4px;background:var(--stage-ground)}
ul.do li::before{background:var(--ok)}
ul.dont li::before{background:var(--no);border-radius:1px;transform:rotate(45deg)}
.checks{display:grid;gap:6px}
.check{display:grid;grid-template-columns:24px 1fr;gap:10px;align-items:start;padding:8px 10px;border-radius:10px;background:var(--bg);cursor:pointer;font-size:15px}
.check input{appearance:none;-webkit-appearance:none;width:22px;height:22px;border-radius:7px;border:2px solid var(--stage-ground);margin:0;display:grid;place-items:center;cursor:pointer;background:var(--surface)}
.check input:checked{background:var(--ok);border-color:var(--ok)}
.check input:checked::after{content:"";width:6px;height:11px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:translateY(-1px) rotate(45deg)}
.check input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.check.on span{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--line)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:14px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.chip svg{width:14px;height:14px;color:var(--accent)}
.dog2 .dog-s{stroke:var(--dog2)}.dog2 .dog-f{fill:var(--dog2)}.dog2 .dog-far{stroke:var(--dog2-dark)}.dog2 .dog-ear{fill:var(--dog2-dark)}
.two-art{background:var(--stage);border-radius:14px;overflow:hidden}
.two-art svg{display:block;width:100%;height:auto}
.two-art figcaption{font-size:13px;color:var(--muted);padding:0 14px 12px}
.signals{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.signals>div{background:var(--bg);border-radius:14px;padding:12px 14px;display:grid;gap:8px;align-content:start;min-width:0}
.two-ico{display:inline-flex;gap:2px;color:var(--accent)}
.two-ico svg{width:16px;height:16px}
.two-ico svg+svg{color:var(--dog2)}
.note{font-size:14px;color:var(--muted);border-left:3px solid var(--stage-ground);padding-left:12px}

/* commands list */
.group{display:grid;gap:8px}
.rows{display:grid;gap:8px}
.row{width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:12px 14px;display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:center;cursor:pointer}
.row-ico{width:52px;height:52px;border-radius:14px;background:var(--stage);display:grid;place-items:center;overflow:hidden}
.row-ico svg{width:52px;height:52px}
.row-main{min-width:0;display:grid;gap:2px}
.row-name{font-family:var(--f-display);font-weight:500;font-size:16px}
.row-cue{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.status-dots{display:flex;gap:3px;margin-top:4px}
.status-dots i{width:16px;height:4px;border-radius:2px;background:var(--sunk)}
.status-dots i.on{background:var(--ok)}
.status-label{font-size:12px;color:var(--muted)}
.chev{width:18px;height:18px;color:var(--muted)}

/* sheet */
.sheet{position:fixed;inset:0;z-index:40;background:var(--bg);display:flex;flex-direction:column;animation:sheetIn .28s ease-out}
@keyframes sheetIn{from{transform:translateX(24px);opacity:.4}to{transform:none;opacity:1}}
.sheet-bar{flex:none;display:flex;align-items:center;gap:8px;padding-top:calc(env(safe-area-inset-top,0px) + 8px);padding-bottom:8px;padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--bg);border-bottom:1px solid var(--line)}
.icon-btn{border:0;background:none;display:inline-flex;align-items:center;gap:4px;padding:8px;border-radius:10px;cursor:pointer;color:var(--accent-ink);font-weight:600}
.icon-btn svg{width:22px;height:22px}
.sheet-title{font-family:var(--f-display);font-size:15px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.sheet-scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.sheet-scroll .wrap{padding-bottom:calc(40px + env(safe-area-inset-bottom,0px))}
.cmd-head{display:grid;gap:8px;padding-block:18px 14px}
.meta-row{display:flex;flex-wrap:wrap;gap:8px}
.pill{font-size:13px;padding:4px 10px;border-radius:999px;background:var(--sunk);color:var(--ink)}
.pill b{font-weight:600}

/* player */
.player{background:var(--surface);border:1px solid var(--line);border-radius:20px;overflow:hidden}
.scene{background:var(--stage);position:relative}
.scene svg{display:block;width:100%;height:auto;max-width:100%}
.player-ctl{display:flex;align-items:center;gap:10px;padding:12px 14px;border-top:1px solid var(--line);flex-wrap:wrap}
.steps-nav{display:flex;gap:6px;flex:1;flex-wrap:wrap}
.step-chip{width:36px;height:36px;border-radius:12px;border:1px solid var(--line);background:var(--bg);font-family:var(--f-mono);font-weight:500;cursor:pointer}
.step-chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.play{width:40px;height:40px;border-radius:50%;border:0;background:var(--accent);color:#fff;display:grid;place-items:center;cursor:pointer;flex:none}
.play svg{width:18px;height:18px}
.step-text{padding:4px 16px 16px;display:grid;gap:6px}
.step-text h3{font-family:var(--f-display);font-weight:500;font-size:17px}
.step-text p{font-size:15px}
.legend{display:flex;flex-wrap:wrap;gap:12px;padding:0 16px 14px;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:50%;display:inline-block}

.steplist{counter-reset:s;display:grid;gap:8px;margin:0;padding:0;list-style:none}
.steplist li{counter-increment:s}
.steplist button{width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:12px 14px;display:grid;grid-template-columns:28px 1fr;gap:10px;cursor:pointer}
.steplist button::before{content:counter(s);font-family:var(--f-mono);font-size:13px;width:26px;height:26px;border-radius:8px;background:var(--sunk);display:grid;place-items:center}
.steplist li.on button{border-color:var(--accent)}
.steplist li.on button::before{background:var(--accent);color:#fff}
.steplist b{display:block;font-weight:600}
.steplist span{font-size:14px;color:var(--muted)}
.ready{background:var(--ok-soft);border-radius:14px;padding:14px;display:grid;gap:4px}
.ready b{color:var(--ok);font-size:12px;letter-spacing:.06em;text-transform:uppercase}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:var(--sunk);padding:4px;border-radius:14px}
.seg button{border:0;background:none;border-radius:10px;padding:9px 4px;font-size:13px;line-height:1.2;min-width:0;font-weight:600;cursor:pointer;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}

/* off-leash */
.rules{display:grid;gap:10px}
.rule{display:grid;gap:4px;padding:14px 16px;border-radius:16px;background:var(--surface);border:1px solid var(--line)}
.rule b{font-weight:600}
.levels{display:grid;gap:12px;counter-reset:lv}
.level{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;display:grid;gap:10px}
.level.now{border-color:var(--accent)}
.level-top{display:grid;grid-template-columns:44px 1fr;gap:12px;align-items:start}
.lv-num{width:44px;height:44px;border-radius:14px;background:var(--sunk);display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:18px}
.level.now .lv-num{background:var(--accent);color:#fff}
.level.passed .lv-num{background:var(--ok);color:#fff}
.lv-title{font-family:var(--f-display);font-weight:500;font-size:17px;line-height:1.25}
.lv-where{font-size:14px;color:var(--muted)}
.crit{font-size:14px;background:var(--sunk);border-radius:10px;padding:8px 12px}
.crit b{font-weight:600}
.tracker{display:grid;gap:8px;border-top:1px dashed var(--line);padding-top:12px}
.tr-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tr-btn{border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:9px 12px;font-weight:600;font-size:14px;cursor:pointer}
.tr-btn.yes{color:var(--ok)}
.tr-btn.no{color:var(--no)}
.tr-dots{display:flex;gap:4px;flex:1;min-width:130px}
.tr-dots i{width:12px;height:12px;border-radius:50%;background:var(--sunk);border:1px solid var(--line)}
.tr-dots i.y{background:var(--ok);border-color:var(--ok)}
.tr-dots i.n{background:var(--no);border-color:var(--no)}
.tr-score{font-family:var(--f-mono);font-size:13px;font-variant-numeric:tabular-nums}
.tr-reset{border:0;background:none;color:var(--muted);font-size:13px;cursor:pointer;text-decoration:underline;padding:4px}
details.faq{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:0 16px}
details.faq summary{cursor:pointer;list-style:none;padding:14px 0;font-weight:600;display:flex;justify-content:space-between;gap:12px}
details.faq summary::-webkit-details-marker{display:none}
details.faq summary::after{content:"+";font-family:var(--f-mono);color:var(--accent-ink);font-size:18px;line-height:1}
details.faq[open] summary::after{content:"–"}
details.faq .faq-body{padding-bottom:14px;display:grid;gap:8px;font-size:15px}

/* basics */
.principles{display:grid;gap:10px}
.pr{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px;display:grid;gap:4px}
.pr h3{font-family:var(--f-display);font-weight:500;font-size:16px}
.pr p{font-size:15px;color:var(--ink)}
.three-d{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
@media (max-width:540px){.three-d{grid-template-columns:1fr}.three-d div{grid-template-columns:120px 1fr;align-items:baseline;gap:8px}}
.three-d div{background:var(--sunk);border-radius:12px;padding:10px;display:grid;gap:2px;min-width:0}
.three-d b{font-family:var(--f-display);font-weight:500;font-size:14px}
.three-d span{font-size:12px;color:var(--muted)}
ol.howto{margin:0;padding:0;list-style:none;counter-reset:h;display:grid;gap:8px}
ol.howto li{counter-increment:h;display:grid;grid-template-columns:28px 1fr;gap:10px;font-size:15px}
ol.howto li::before{content:counter(h);width:26px;height:26px;border-radius:8px;background:var(--accent-soft);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--f-mono);font-size:13px}

/* tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
.tabbar-in{max-width:620px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.tab{border:0;background:none;padding:9px 2px 8px;display:grid;justify-items:center;gap:3px;font-size:11px;font-weight:600;color:var(--muted);cursor:pointer}
.tab svg{width:24px;height:24px}
.tab.on{color:var(--accent-ink)}

/* scene svg */
.g-line{stroke:var(--stage-ground);stroke-width:2}
.g-ticks{stroke:var(--stage-ground);stroke-width:2;stroke-dasharray:3 21;stroke-linecap:round}
.mat{fill:var(--mat)}
.p-torso{fill:var(--sleeve)}
.p-leg{stroke:var(--pants);stroke-width:13;stroke-linecap:round;fill:none}
.p-shoe{fill:var(--ink)}
.p-arm{stroke:var(--sleeve);stroke-width:12;stroke-linecap:round;fill:none}
.skin{fill:var(--skin)}
.dog-far{stroke:var(--dog-dark);stroke-width:11;stroke-linecap:round;stroke-linejoin:round;fill:none}
.dog-s{stroke:var(--dog);stroke-linecap:round;stroke-linejoin:round;fill:none}
.dog-f{fill:var(--dog)}
.dog-ear{fill:var(--dog-dark)}
.ink-f{fill:var(--ink)}
.collar{stroke:var(--accent);stroke-width:5;stroke-linecap:round}
.toy{fill:var(--toy)}
.treat{fill:var(--treat)}
.leash{fill:none;stroke:var(--accent);stroke-width:3;stroke-linecap:round}
.leash.long{stroke:var(--toy);stroke-width:2.5}
.arm{stroke:var(--sleeve);stroke-width:13;stroke-linecap:round;fill:none}
.knuckle{stroke:var(--dog-dark);stroke-width:1.5;stroke-linecap:round;opacity:.5}
.bub{fill:var(--surface);stroke:var(--line);stroke-width:1}
.bub-t{fill:var(--ink);font-family:var(--f-body);font-weight:600;font-size:15px}
.mark-b{fill:var(--ok)}
.mark-t{fill:#fff;font-family:var(--f-body);font-weight:700;font-size:15px}
.tiny-t{fill:var(--muted);font-family:var(--f-mono);font-size:10px}

@media (prefers-reduced-motion: reduce){.sheet{animation:none}.bar i{transition:none}}
</style>

<script>
(function(){
"use strict";

/* ---------- storage ---------- */
var KEY = "vosp-sobaki-v1";
var S = {name:"", birth:"", home:"", checks:{}, cmd:{}, rec:{}, pre:{}};
try { var raw = localStorage.getItem(KEY); if (raw) { var o = JSON.parse(raw); for (var k in o) S[k] = o[k]; } } catch(e) {}
if (!S.name) S.name = "Полли";
function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e) {} }
function dogName(){ return (S.name || "").trim() || "Полли"; }

/* ---------- content: stages ---------- */
var STAGES = [
 { id:"s1", range:"День 1–3", title:"Первые дни дома", sub:"Безопасность, сон и распорядок",
   lead:"Команды учить ещё рано. Главное сейчас — чтобы собака почувствовала себя в безопасности и поняла распорядок: где спать, где есть, куда ходить в туалет.",
   do:["Выносите в туалет после сна, еды, игры и каждые 1–2 часа (щенка). Сразу после — похвала и лакомство.",
       "Давайте спать: щенок спит 18–20 часов в сутки. Место для сна — в тихом углу, не в проходе.",
       "Знакомьте с семьёй спокойно и по очереди, без толпы гостей в первые дни.",
       "Называйте по кличке только в приятных ситуациях: еда, ласка, игра.",
       "Кормите тем же кормом, что у заводчика или в приюте. Новый корм вводите постепенно, за 5–7 дней."],
   dont:["Ругать за лужи и тыкать носом. Собака не связывает наказание с тем, что сделала раньше, и начинает прятаться, чтобы сходить в туалет.",
         "Оставлять одну надолго в первый же день.",
         "Подзывать, чтобы сделать неприятное: стричь когти, купать, закрыть."],
   note:"Взрослой собаке из приюта нужно больше времени. Ориентир «3–3–3»: около 3 дней на стресс, 3 недели на привыкание к распорядку и 3 месяца, чтобы почувствовать себя дома.",
   check:["Место для сна готово и стоит в тихом углу","Провода, обувь, бытовая химия и лекарства убраны","Есть шлейка, поводок и адресник с телефоном","Найден ветеринар, назначен первый визит","Составлен график туалета"],
   cmds:[] },
 { id:"s2", range:"8–12 недель", title:"Социализация и первые навыки", sub:"Самое важное окно в жизни собаки",
   lead:"Период социализации закрывается примерно к 12–14 неделям. Всё, с чем щенок спокойно познакомится сейчас, станет для него нормой на всю жизнь.",
   do:["Каждый день — что-то новое: люди в шапках и очках, дети, зонт, пылесос, звук машин, лифт, разные поверхности. Коротко и с лакомством.",
       "Приучайте к рукам: трогайте лапы, уши, смотрите зубы и сразу награждайте.",
       "Тренируйте одиночество: выходите из комнаты на минуту, потом на 5, 10. Возвращайтесь спокойно, без бурных приветствий.",
       "Учите «мягкий рот»: если щенок прикусил сильно — короткое «Ай!», игра прекращается на 10–20 секунд, потом дайте жевательную игрушку.",
       "Занятия по 3–5 минут, 3–4 раза в день. Заканчивайте на удачном повторе."],
   dont:["Гулять по земле там, где много чужих собак, до окончания прививок. Сроки уточните у ветеринара; до этого выносите щенка на руках, чтобы он видел и слышал улицу.",
         "Играть руками «в драку» — щенок учится, что руки можно кусать.",
         "Заставлять подходить к страшному. Дайте щенку смотреть с безопасного расстояния."],
   note:"Если собака взрослая, этот этап тоже нужен: маркер, имя и «Сидеть» — с них начинается любое обучение.",
   check:["Маркер «Да!» заряжен","Отзывается на кличку дома","Познакомился с 10 новыми людьми","Видел и слышал 10 новых вещей: машины, лифт, пылесос…","Спокойно даёт трогать лапы и уши","Спокойно ходит в шлейке по дому"],
   cmds:["marker","name","sit","recall"] },
 { id:"s3", range:"3–4 месяца", title:"Первые прогулки", sub:"Улица, туалет, поводок",
   lead:"После прививок и карантина начинается улица. Мир огромный и интересный, поэтому снижайте требования: то, что получается дома, на улице придётся учить заново.",
   do:["Переносите туалет на улицу: выходите сразу после сна и еды, награждайте прямо на месте.",
       "Начинайте «Рядом» как игру: провисший поводок — идём, натянутый — стоим.",
       "Учите «Ко мне» на улице на длинном поводке (корде) 3–5 метров.",
       "Играйте в прятки: пока щенок нюхает, спрячьтесь за дерево. Нашёл — праздник. Сейчас щенки ещё держатся рядом с хозяином — используйте это.",
       "Учите «Оставь»: на улице много мусора.",
       "Знакомьте со спокойными взрослыми собаками, а не со всеми подряд."],
   dont:["Отпускать с поводка, даже если щенок «и так не отходит». Через пару месяцев начнётся подростковый возраст, и привычка убегать закрепится.",
         "Таскать за поводок. Если щенок упирается, присядьте и подманите.",
         "Гулять часами. Ориентир для щенка — около 5 минут прогулки на каждый месяц возраста за один выход, плюс свободное время для нюхания."],
   note:"С 4 до 6 месяцев меняются зубы. Щенок грызёт всё подряд — давайте разрешённые жевательные игрушки и убирайте ценное.",
   check:["Ходит в туалет на улице","«Сидеть» получается на улице","Прибегает на «Ко мне» на корде в тихом месте","«Лежать» получается дома","Привык к корде и шлейке","Сыграли в прятки на прогулке"],
   cmds:["down","heel","leave","recall"] },
 { id:"s4", range:"4–6 месяцев", title:"Выдержка и обобщение", sub:"Те же команды в разных местах",
   lead:"Собака уже знает основные команды дома. Теперь задача — чтобы они работали везде: во дворе, в парке, в гостях, рядом с другими собаками.",
   do:["Повторяйте каждую команду в 5 разных местах. В новом месте начинайте с самого лёгкого уровня.",
       "Учите выдержку: «Ждать», «Место», «Свободно!».",
       "Учите «Дай» через обмен и игру в перетяжку с правилами.",
       "На прогулке на корде ловите моменты, когда собака сама оглянулась на вас, — «Да!» и лакомство.",
       "Постепенно увеличивайте время одиночества."],
   dont:["Ждать, что команда, выученная на кухне, сработает в парке.",
         "Повторять команду много раз. Сказали один раз — помогите жестом или упростите задачу."],
   note:"Правило трёх «Д»: длительность, дистанция и отвлечения. Усложняйте только одно за раз.",
   check:["«Сидеть» и «Лежать» работают в 5 разных местах","Держит «Ждать» 30 секунд","Уходит на «Место» по слову","Отдаёт игрушку по «Дай»","Сама оглядывается на вас на прогулке"],
   cmds:["wait","place","give"] },
 { id:"s5", range:"6–12 месяцев", title:"Подростковый период", sub:"«Всё забыл» — это нормально",
   lead:"Собака как будто забывает команды, проверяет границы, сильнее реагирует на запахи и на других собак. Это этап взросления, а не испорченное обучение. Он проходит, если сохранять спокойствие и последовательность.",
   do:["Вернитесь к более лёгким условиям и повысьте ценность награды: сыр, мясо, игра.",
       "Давайте больше нагрузки на нос и голову: поиск лакомств, нюхательный коврик, новые маршруты.",
       "На прогулке — корда, пока подзыв не работает в 9 случаях из 10.",
       "Отрабатывайте подзыв от других собак с помощником.",
       "Держите стабильный режим дня."],
   dont:["Отпускать с поводка «на авось». Каждый удачный побег закрепляет привычку убегать.",
         "Звать, когда собака точно не придёт. Так вы учите её не слушать команду.",
         "Наказывать за медленный подход. Собака запомнит: подошла — получила неприятность."],
   note:"Кастрация и стерилизация влияют на поведение и здоровье. Оптимальный возраст зависит от размера породы — обсудите это с ветеринаром.",
   check:["Подзыв на корде работает в 9 из 10 случаев","Проходит мимо собак на поводке без рывков","Ежедневно есть занятия на нюх или голову","Пройден уровень 3 программы «Без поводка»"],
   cmds:["recall","heel","wait"] },
 { id:"s6", range:"1–2 года", title:"Взрослая собака", sub:"Свобода и поддержание навыков",

   do:["Отпускайте с поводка в разрешённых безопасных местах, когда пройдены уровни 5–6 программы «Без поводка».",
       "Каждую прогулку делайте 3–5 подзывов «просто так»: позвали, наградили, отпустили.",
       "Награждайте не каждый раз лакомством, но всегда хвалите. Иногда — «джекпот».",
       "Пробуйте новое: нюхательная работа, аджилити, трюки, походы.",
       "Раз в неделю проверяйте аварийный подзыв (свисток) с самой ценной наградой."],
   dont:["Перестать награждать за подзыв: «она и так знает». Без награды команда постепенно ослабевает.",
         "Отпускать рядом с дорогой, даже если собака идеально слушается."],
   note:"Любой срыв — повод вернуться на один уровень назад, к корде, а не наказывать.",
   check:["Свободно гуляет в безопасных местах","Подзыв от собак и запахов работает","Есть занятие, которое нравится вам обоим","Аварийный подзыв проверен в этом месяце"],
   cmds:["recall"] }
];

/* ---------- content: commands (with animation keyframes) ---------- */
var CMDS = [
 { id:"marker", group:"Фундамент", name:"Маркер «Да!»", cue:"слово «Да!» или щелчок кликера", age:"с первого дня",
   why:"Маркер — это «фотография» правильного момента. Он говорит собаке, за что именно она получает награду, и ускоряет обучение любой команде.",
   steps:[
    {t:"Зарядите маркер", d:"Скажите «Да!» коротко и бодро и в течение секунды дайте кусочек лакомства. Собаке пока ничего не нужно делать. 10–15 повторов за подход, 2–3 подхода в день.",
     a:[{p:"stand",hand:null,d:300,h:500},{mark:1,d:150,h:450},{hand:[330,112],tr:1,d:250,h:50},{hand:[254,74],d:450,h:350},{tr:0,d:200,h:500},{hand:null,d:400,h:400}]},
    {t:"Проверьте", d:"Подождите, пока собака отвлечётся и начнёт нюхать пол, и скажите «Да!». Если она сразу поднимает голову и ищет вас глазами — маркер заряжен.",
     a:[{p:"sniff",hand:null,d:500,h:1000},{mark:1,d:150,h:150},{p:"alert",d:280,h:350},{hand:[252,58],tr:1,d:450,h:250},{tr:0,d:200,h:350},{hand:null,d:400,h:300}]},
    {t:"Маркер в работе", d:"Теперь «Да!» звучит ровно в момент правильного действия, а лакомство приходит следом. Это обещание: после «Да!» награда есть всегда, даже если вы ошиблись с моментом.",
     a:[{p:"stand",hand:null,h:600},{p:"sit",d:800,h:100},{mark:1,d:120,h:400},{hand:[228,70],tr:1,d:450,h:200},{tr:0,d:200,h:400},{hand:null,p:"stand",d:600,h:400}]}

   mistakes:["Сказать «Да!» и забыть наградить — слово обесценивается.","Маркер с опозданием: собака уже встала, а вы только говорите «Да!». Отмечайте точно в момент действия.","Тянуться за лакомством до маркера. Сначала слово, потом рука — иначе собака смотрит на руку, а не слушает."],
   ready:"Собака поднимает голову на «Да!» в любой комнате дома." },

 { id:"name", group:"Фундамент", name:"Имя и «Смотри»", cue:"кличка, «Смотри»", age:"с 8 недель",
   why:"Внимание — начало любой команды. Если собака не посмотрела на вас, следующее слово она просто не услышит.",
   steps:[
    {t:"Кличка — значит «посмотри на меня»", d:"Произнесите кличку один раз. Собака повернула голову — «Да!» и лакомство. Никогда не используйте кличку, чтобы ругать.",
     a:[{p:"sniff",hand:null,d:400,h:900},{say:"{name}!",d:100,h:350},{p:"alert",d:280,h:150},{mark:1,d:100,h:400},{hand:[252,58],tr:1,d:450,h:200},{tr:0,d:200,h:400},{hand:null,p:"stand",d:400,h:300}]},
    {t:"Контакт глаз", d:"Отведите руку с лакомством в сторону и ждите молча. Собака сначала смотрит на руку, потом переводит взгляд на ваше лицо — в этот момент «Да!» и лакомство.",
     a:[{p:"stand",hand:[320,128],tr:1,d:500,h:1100},{p:"up",d:400,h:300},{mark:1,d:100,h:400},{hand:[244,46],d:450,h:200},{tr:0,d:200,h:400},{hand:null,p:"stand",d:400,h:300}]},
    {t:"Добавьте «Смотри»", d:"Когда собака уверенно переводит взгляд на лицо, говорите «Смотри» перед ожиданием. Постепенно увеличивайте время контакта до 3–5 секунд.",

  cmdPlayer.stop(); cmdPlayer.pausedAt = 0; cmdPlayer.load(c.steps[i].a, c.scene);
  if (playing) cmdPlayer.play();
  $("step-text").innerHTML = '<h3>Шаг '+(i+1)+'. '+c.steps[i].t+'</h3><p>'+nm(c.steps[i].d)+'</p>';
  $("sheet-body").querySelectorAll(".step-chip").forEach(function(b,j){ b.classList.toggle("on", j===i); b.setAttribute("aria-selected", j===i); });
  $("sheet-body").querySelectorAll("#steplist li").forEach(function(li,j){ li.classList.toggle("on", j===i); });
  updPlay();
}
function updPlay(){ var b=$("play"); if(!b) return; b.innerHTML = playing ? ICON_PAUSE : ICON_PLAY; b.setAttribute("aria-label", playing ? "Пауза" : "Смотреть анимацию"); }
function closeCmd(){
  if (cmdPlayer){ cmdPlayer.stop(); cmdPlayer = null; }
  sheetOpen = false; $("sheet").hidden = true; document.body.style.overflow = "";
  if (currentTab==="offleash" && offPlayer) offPlayer.play();
}
$("sheet-back").addEventListener("click", closeCmd);
document.addEventListener("keydown", function(e){ if (e.key==="Escape" && sheetOpen) closeCmd(); });

/* ---------- tabs ---------- */
var currentTab = "path";
function setTab(t){
  currentTab = t;
  document.querySelectorAll("[data-view]").forEach(function(s){ s.hidden = s.getAttribute("data-view")!==t; });
  document.querySelectorAll(".tab").forEach(function(b){ var on=b.getAttribute("data-tab")===t; b.classList.toggle("on", on); if(on) b.setAttribute("aria-current","page"); else b.removeAttribute("aria-current"); });
  if (offPlayer){ if (t==="offleash" && !sheetOpen) offPlayer.play(); else offPlayer.stop(); }
  window.scrollTo(0,0);
}
document.querySelectorAll(".tab").forEach(function(b){ b.addEventListener("click", function(){ if (sheetOpen) closeCmd(); setTab(b.getAttribute("data-tab")); }); });
$("dogchip").addEventListener("click", function(){ setTab("basics"); setTimeout(function(){ var i=$("ba-name"); if(i) i.focus({preventScroll:false}); }, 50); });
document.addEventListener("visibilitychange", function(){
  if (document.hidden){ if (cmdPlayer) cmdPlayer.stop(); if (offPlayer) offPlayer.stop(); }
  else { if (sheetOpen && cmdPlayer && playing) cmdPlayer.play(); else if (currentTab==="offleash" && offPlayer) offPlayer.play(); }
});

function renderAll(){ renderChip(); renderPath(); renderCommands(); renderOff(); renderBasics(); }
renderAll();
var h = (location.hash||"").replace("#","");
if (["path","commands","offleash","basics"].indexOf(h) >= 0) setTab(h);
else if (h==="two"){ openTwo = true; renderPath(); var tc=$("two-card"); if(tc) tc.scrollIntoView(); }
else if (CMD[h]) openCmd(h);
})();
</script>
